name: 功能建议 / Feature request
description: 描述你遇到的问题、期望行为和适用场景。
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [项目说明和能力边界](https://github.com/zuixi01/Wechat-autoreply/blob/main/README.md)，并搜索现有建议。
        请用虚构示例说明需求，不要提交 API key、联系人、聊天记录或其他个人资料。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪个步骤让你无法完成任务？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述用户操作和可观察的结果，必要时注明适用平台。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: 可补充合成示例、适用场景和限制。
