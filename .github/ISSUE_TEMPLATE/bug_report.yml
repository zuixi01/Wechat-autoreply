name: 缺陷报告 / Bug report
description: 报告可复现的问题，帮助维护者定位原因。
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [README](https://github.com/zuixi01/Wechat-autoreply/blob/main/README.md) 和 [贡献指南](https://github.com/zuixi01/Wechat-autoreply/blob/main/CONTRIBUTING.md)，并搜索现有 Issue。
        请勿提交 API key、令牌、数据库地址、真实联系人、聊天记录或未经脱敏的截图。安全问题请使用 [安全报告渠道](https://github.com/zuixi01/Wechat-autoreply/blob/main/SECURITY.md)。
  - type: input
    id: version
    attributes:
      label: 应用版本或 commit
      placeholder: 例如 1.2.4，或 git rev-parse --short HEAD 的结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统和运行方式
      description: Windows 版本；从源码运行时补充 Node.js、npm 和 .NET SDK 版本。
      placeholder: Windows 11 x64；源码 / 目录包 / 安装包
    validations:
      required: true
  - type: input
    id: wechat-version
    attributes:
      label: 微信版本（如相关）
      description: 只填写客户端版本，无需提供账号或联系人信息。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 使用虚构联系人和合成消息说明操作；不要附带真实聊天内容。
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可补充经过脱敏的错误码和日志摘要。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，并确认没有提交凭据、个人资料或真实聊天内容。
          required: true
