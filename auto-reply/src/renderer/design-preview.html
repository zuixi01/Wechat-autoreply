<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoReply · 自动回复与用户管理预览</title>
  </head>
  <body>
    <div id="root"></div>
    <div class="design-preview-badge">设计预览 · 示例数据 · 不连接微信或模型</div>
    <script type="module">
      // Offline design entry only. Not imported by the desktop app or bundled in production.
      const listeners = new Map()
      const emit = (event, data) =>
        (listeners.get(event) || []).forEach((fn) => fn(structuredClone(data)))
      const timestamp = Date.now()
      const mode = (id, name, prompt, specificObjects = []) => ({
        id,
        name,
        prompt,
        source: id === 'daily' ? 'custom' : 'system',
        sentimentEnabled: false,
        unifiedPrefix: '',
        enabled: true,
        running: false,
        autoReply: false,
        specificObjects,
        createdAt: timestamp,
        updatedAt: timestamp
      })
      const models = [
        {
          id: 'vision-demo',
          name: '豆包 · 视觉识别',
          provider: 'volcengine-ark',
          modelName: 'doubao-seed-2-0-lite-260215',
          apiKey: 'offline-preview',
          baseURL: '',
          capabilities: ['text', 'vision'],
          createdAt: timestamp
        },
        {
          id: 'reply-demo',
          name: 'DeepSeek · 回复生成',
          provider: 'deepseek',
          modelName: 'deepseek-chat',
          apiKey: 'offline-preview',
          baseURL: '',
          capabilities: ['text'],
          createdAt: timestamp
        }
      ]
      const settings = {
        locale: 'zh',
        theme: 'light',
        appType: 'wechat',
        vision: { apiKey: '', model: '', baseURL: '' },
        chatProvider: { manifestUrl: '', installed: null, config: {} },
        defaultCaptureStrategy: 'auto',
        capture: {},
        models,
        globalVisionModelId: 'vision-demo',
        globalReplyModelId: 'reply-demo',
        globalDefaultModeId: 'work',
        globalAutoReply: false,
        modes: [
          mode(
            'work',
            '工作回复',
            '以专业、礼貌的语气回复。先回应对方的问题，保持简洁；不确定的信息先核实，不作未经确认的承诺。',
            [
              {
                id: 'contact-a',
                name: '王女士',
                title: '王经理',
                relationship: '合作客户',
                modeId: 'work',
                autoReply: null
              },
              {
                id: 'contact-b',
                name: '陈先生',
                title: '',
                relationship: '项目同事',
                modeId: 'work',
                autoReply: false
              }
            ]
          ),
          mode('service', '客户服务', '耐心倾听，先理解客户需求，再给出明确的下一步。'),
          mode('daily', '日常交流', '语气自然、轻松，简短回复。')
        ]
      }
      const changed = () => {
        emit('mode:changed', {})
        emit('settings:changed', { theme: settings.theme, locale: settings.locale })
      }
      window.electron = {
        on(event, listener) {
          const list = listeners.get(event) || []
          list.push(listener)
          listeners.set(event, list)
          return () =>
            listeners.set(
              event,
              list.filter((fn) => fn !== listener)
            )
        },
        send(event, data) {
          emit(event, data || {})
        },
        async invoke(channel, ...args) {
          if (channel === 'settings:getAll') return structuredClone(settings)
          if (channel === 'settings:get') return structuredClone(settings[args[0]])
          if (channel === 'settings:set') {
            Object.assign(settings, args[0])
            changed()
            return { success: true }
          }
          if (channel === 'mode:list') return structuredClone(settings.modes)
          if (channel === 'mode:create') {
            const created = mode(crypto.randomUUID(), args[0].name, args[0].prompt)
            Object.assign(created, args[0], { source: 'custom' })
            settings.modes.push(created)
            changed()
            return { success: true, mode: structuredClone(created) }
          }
          if (['mode:update', 'mode:toggleEnabled', 'mode:setAutoReply'].includes(channel)) {
            const selected = settings.modes.find((m) => m.id === args[0])
            if (!selected) return { success: false, error: '找不到模式' }
            Object.assign(
              selected,
              channel === 'mode:toggleEnabled'
                ? { enabled: args[1] }
                : channel === 'mode:setAutoReply'
                  ? { autoReply: args[1] }
                  : args[1]
            )
            changed()
            return { success: true, mode: structuredClone(selected) }
          }
          if (channel === 'mode:delete') {
            settings.modes = settings.modes.filter((m) => m.id !== args[0])
            changed()
            return { success: true }
          }
          if (channel === 'mode:start') {
            const selected = settings.modes.find((m) => m.id === args[0])
            selected.running = true
            changed()
            emit('mode:runningChanged', { modeId: selected.id, running: true })
            setTimeout(() => {
              emit('engine:log', {
                modeId: selected.id,
                type: 'thinking',
                content: '演示：发现新消息，正在生成推荐回复。'
              })
              emit('engine:recommendReply', {
                modeId: selected.id,
                text: '您好，收到您的消息了。我会核实相关信息后尽快回复您。'
              })
              emit('engine:pendingChanged', { modeId: selected.id, pending: true })
            }, 200)
            return { success: true }
          }
          if (channel === 'mode:stop') {
            const selected = settings.modes.find((m) => m.id === args[0])
            selected.running = false
            changed()
            emit('mode:runningChanged', { modeId: selected.id, running: false })
            return { success: true }
          }
          if (channel === 'object:create') {
            const added = { id: crypto.randomUUID(), modeId: args[0], ...args[1] }
            settings.modes.find((m) => m.id === added.modeId).specificObjects.push(added)
            changed()
            return { success: true, object: structuredClone(added) }
          }
          if (channel === 'object:update') {
            const selected = settings.modes
              .find((m) => m.id === args[0])
              .specificObjects.find((o) => o.id === args[1])
            Object.assign(selected, args[2])
            if (args[2].modeId && args[2].modeId !== args[0]) {
              const previous = settings.modes.find((m) => m.id === args[0])
              previous.specificObjects = previous.specificObjects.filter(
                (o) => o.id !== selected.id
              )
              settings.modes.find((m) => m.id === args[2].modeId).specificObjects.push(selected)
            }
            changed()
            return { success: true, object: structuredClone(selected) }
          }
          if (channel === 'object:delete') {
            const selected = settings.modes.find((m) => m.id === args[0])
            selected.specificObjects = selected.specificObjects.filter((o) => o.id !== args[1])
            changed()
            return { success: true }
          }
          if (channel === 'model:list') return structuredClone(settings.models)
          if (channel === 'model:create') {
            settings.models.push({ id: crypto.randomUUID(), ...args[0], createdAt: timestamp })
            changed()
            return { success: true }
          }
          if (channel === 'model:update') {
            Object.assign(
              settings.models.find((m) => m.id === args[0]),
              args[1]
            )
            changed()
            return { success: true }
          }
          if (channel === 'model:delete') {
            settings.models = settings.models.filter((m) => m.id !== args[0])
            changed()
            return { success: true }
          }
          if (channel === 'model:testConnection')
            return { success: false, error: '离线设计预览，请在桌面客户端测试真实连接。' }
          if (channel === 'reply:send' || channel === 'reply:paste') {
            const selected = settings.modes.find((m) => m.running)
            if (selected)
              emit('engine:log', {
                modeId: selected.id,
                type: 'reply',
                content:
                  channel === 'reply:send'
                    ? '演示：确认发送，不会实际发送消息。'
                    : '演示：粘贴回复，不会操作微信。'
              })
            return { success: true }
          }
          if (channel === 'engine:exitStandby') {
            emit('engine:pendingChanged', { modeId: args[0], pending: false })
            return { success: true }
          }
          if (channel === 'engine:setUserInput') return { success: true }
          if (channel === 'train:status') return { running: false }
          if (channel === 'train:start' || channel === 'capture:openSetupWizard')
            return { success: false, error: '请在桌面客户端使用此功能。' }
          if (channel === 'trace:listSessions' || channel === 'memory:listCards') return []
          if (channel === 'providerHub:getCatalog' || channel === 'providerHub:update')
            return {
              success: true,
              catalog: {
                providers: [
                  {
                    id: 'doubao',
                    name: '豆包 Seed',
                    description: '离线预览供应商配置',
                    version: '1.0.0',
                    manifestUrl: 'builtin://doubao',
                    configSchema: {
                      fields: [
                        { key: 'apiKey', label: 'API Key', type: 'password', required: true },
                        { key: 'systemPrompt', label: '回复规则', type: 'textarea' }
                      ]
                    }
                  }
                ]
              }
            }
          return { success: false, error: '此操作需要桌面客户端。' }
        }
      }
      // Synthetic private APIs for this offline entry only. No client or server is contacted.
      const demoScope = {
        tenant_id: 'preview-tenant',
        employee_id: 'preview-employee',
        account_id: 'preview-account',
        agent_id: 'preview-agent',
        platform: 'wechat'
      }
      window.agentDesktop = {
        async status() {
          return { state: 'connected', scope: demoScope }
        },
        async refresh() {
          return { state: 'connected', scope: demoScope }
        }
      }
      let runtimeStatus = {
        state: 'paused',
        reason: 'none',
        lease: 'stopped',
        pauseAcknowledged: true,
        configurationVersion: 'demo-rule-v1'
      }
      let demoRows = []
      window.agentRuntime = {
        async status() {
          return structuredClone(runtimeStatus)
        },
        async synchronize() {
          return structuredClone(runtimeStatus)
        },
        async start() {
          runtimeStatus = {
            ...runtimeStatus,
            state: 'running',
            lease: 'active',
            reason: 'none',
            pauseAcknowledged: false
          }
          const now = Date.now()
          demoRows = [
            {
              taskId: 'preview-task',
              conversationId: 'preview-conversation',
              status: 'sent',
              version: 'a'.repeat(64),
              inboundPreview: '演示消息：请问明天下午方便联系吗？',
              replyText: '演示回复：您好，明天下午可以。我会提前确认时间，谢谢。',
              createdAt: now,
              updatedAt: now,
              humanOwned: false,
              stopAcknowledged: true,
              canSkip: false,
              canRelease: false
            }
          ]
          return structuredClone(runtimeStatus)
        },
        async pause() {
          runtimeStatus = {
            ...runtimeStatus,
            state: 'paused',
            lease: 'stopped',
            reason: 'user_pause',
            pauseAcknowledged: true
          }
          return structuredClone(runtimeStatus)
        }
      }
      window.agentWorkbench = {
        async snapshot() {
          return { state: 'available', rows: structuredClone(demoRows) }
        }
      }
      window.knowledge = (await import('./design-knowledge-preview.ts')).previewKnowledge
      await import('./src/main.tsx')
    </script>
  </body>
</html>
